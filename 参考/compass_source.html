<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>人机关系罗盘</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f0f8ff;--bg2:#e4effe;
  --card:#fff;--card2:#fafaf7;
  --text:#111;--dim:#777;--dim2:#999;
  --border:#111;--border-w:2.5px;
  --orange:#2abfe8;--orange2:#1cb5d4;--orange-light:rgba(42,191,232,0.1);
  --shadow:4px 4px 0 #111;--shadow-sm:2px 2px 0 #111;
  --font-display:'Playfair Display',Georgia,serif;
  --font-body:'Noto Sans SC',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}

html{font-size:16px}
body{
  font-family:var(--font-body);
  background:var(--bg);color:var(--text);
  min-height:100dvh;overflow-x:hidden;
  background-image:
    linear-gradient(rgba(0,0,0,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,0,0,0.03) 1px,transparent 1px);
  background-size:24px 24px;
}

.top-progress{
  position:fixed;top:0;left:0;width:100%;height:3px;
  background:rgba(0,0,0,0.06);z-index:1000;
}
.top-progress-fill{
  height:100%;width:0;
  background:var(--orange);
  transition:width 0.5s cubic-bezier(0.22,1,0.36,1);
}

section{display:none;min-height:100dvh;padding:24px 20px}
section.active{display:flex;flex-direction:column}

#landing{justify-content:center;align-items:center;text-align:center;gap:0;padding:40px 20px}

.landing-tag{
  font-family:var(--font-mono);font-size:10px;letter-spacing:3px;
  color:var(--dim);text-transform:uppercase;
  border:1.5px solid var(--text);padding:4px 14px;
  display:inline-block;margin-bottom:24px;
}

.landing-title{
  font-family:var(--font-display);font-size:clamp(42px,10vw,64px);
  font-weight:900;line-height:1;letter-spacing:-2px;
  margin-bottom:6px;
}
.landing-title em{
  font-style:italic;color:var(--orange);
  -webkit-text-stroke:0;
}

.landing-sub{
  font-family:var(--font-display);font-size:clamp(16px,4vw,22px);
  font-weight:400;font-style:italic;color:var(--dim);
  margin-bottom:32px;letter-spacing:0.5px;
}

.landing-stats{
  display:flex;gap:0;margin-bottom:32px;
  border:var(--border-w) solid var(--border);
  box-shadow:var(--shadow);
}
.landing-stat{
  padding:16px 24px;text-align:center;
  border-right:var(--border-w) solid var(--border);
}
.landing-stat:last-child{border-right:none}
.landing-stat .n{
  font-family:var(--font-mono);font-size:32px;font-weight:700;
}
.landing-stat .l{
  font-size:10px;color:var(--dim);letter-spacing:2px;
  text-transform:uppercase;margin-top:2px;
}

.landing-desc{
  max-width:420px;font-size:13px;line-height:2;color:var(--dim);
  margin-bottom:20px;
}
.landing-link-row{
  display:flex;align-items:center;justify-content:center;gap:12px;
  margin-bottom:28px;flex-wrap:wrap;
}
.landing-link-block{
  width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  background:var(--orange);color:#fff;border:var(--border-w) solid var(--border);
  box-shadow:var(--shadow-sm);text-decoration:none;font-family:var(--font-mono);
  font-size:11px;font-weight:700;transition:all 0.16s cubic-bezier(0.22,1,0.36,1);
  position:relative;overflow:hidden;
}
.landing-link-block:hover{
  box-shadow:var(--shadow);transform:translate(-1px,-1px) rotate(-4deg);
}
.landing-link-block .shape,
.landing-link-block .play{
  position:absolute;transition:all 0.16s ease;
}
.landing-link-block .shape{opacity:1;transform:translateX(0) rotate(0deg)}
.landing-link-block .play{opacity:0;transform:translateX(-4px) rotate(-10deg)}
.landing-link-block:hover .shape{opacity:0;transform:translateX(4px) rotate(10deg)}
.landing-link-block:hover .play{opacity:1;transform:translateX(1px) rotate(0deg)}

.btn-start{
  font-family:var(--font-body);
  padding:16px 56px;
  background:var(--text);color:var(--bg);
  border:var(--border-w) solid var(--border);
  font-size:15px;font-weight:700;letter-spacing:2px;
  cursor:pointer;position:relative;
  box-shadow:var(--shadow);
  transition:all 0.15s;
  -webkit-tap-highlight-color:transparent;
}
.btn-start:hover{
  background:var(--orange);color:#fff;
  box-shadow:6px 6px 0 #111;
  transform:translate(-2px,-2px);
}
.btn-start:active{
  box-shadow:1px 1px 0 #111;
  transform:translate(2px,2px);
}

.btn-mode{
  font-family:var(--font-body);
  padding:12px 28px;
  background:var(--card);color:var(--text);
  border:var(--border-w) solid var(--border);
  font-size:13px;font-weight:600;letter-spacing:1px;
  cursor:pointer;
  box-shadow:var(--shadow-sm);
  transition:all 0.15s;
  -webkit-tap-highlight-color:transparent;
}
.btn-mode:hover{
  background:var(--orange);color:#fff;
  box-shadow:4px 4px 0 #111;
  transform:translate(-1px,-1px);
}
.btn-mode:active{
  box-shadow:0 0 0 #111;
  transform:translate(2px,2px);
}
.landing-footer{
  margin-top:24px;font-size:10px;color:var(--dim2);
  line-height:1.8;max-width:300px;
}

#quiz{
  justify-content:center;align-items:center;gap:20px;
  padding-top:32px;padding-bottom:40px;
}

.quiz-header{
  width:100%;max-width:480px;
  display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--font-mono);font-size:11px;color:var(--dim);
}

.section-card{
  background:var(--card);
  border:var(--border-w) solid var(--border);
  box-shadow:var(--shadow);
  padding:48px 32px;
  width:100%;max-width:480px;
  text-align:center;
  animation:cardIn 0.4s cubic-bezier(0.22,1,0.36,1);
}
.section-num{
  font-family:var(--font-display);font-size:72px;
  font-weight:900;color:var(--text);opacity:0.08;
  line-height:1;margin-bottom:12px;
}
.section-label{
  font-family:var(--font-mono);font-size:10px;
  letter-spacing:3px;color:var(--orange);
  text-transform:uppercase;margin-bottom:16px;
}
.section-hint{
  font-size:14px;line-height:2;color:var(--dim);
}

.q-card{
  background:var(--card);
  border:var(--border-w) solid var(--border);
  box-shadow:var(--shadow);
  padding:32px 28px;
  width:100%;max-width:480px;
  position:relative;
  animation:cardIn 0.35s cubic-bezier(0.22,1,0.36,1);
}

@keyframes cardIn{
  from{opacity:0;transform:translateY(20px) rotate(-0.5deg)}
  to{opacity:1;transform:translateY(0) rotate(0)}
}
@keyframes cardOut{
  from{opacity:1;transform:translateY(0) rotate(0)}
  to{opacity:0;transform:translateY(-20px) rotate(0.5deg)}
}

.q-card.exiting{animation:cardOut 0.25s ease forwards}

.q-top{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:20px;
  padding-bottom:12px;
  border-bottom:1px solid rgba(0,0,0,0.06);
}
.q-number{
  font-family:var(--font-mono);font-size:12px;font-weight:700;
  background:var(--text);color:var(--bg);
  padding:3px 10px;
}
.q-cat{
  font-family:var(--font-mono);font-size:10px;
  color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;
}

.q-text{
  font-size:16px;line-height:1.9;margin-bottom:28px;
  font-weight:400;
}

.options{display:flex;flex-direction:column;gap:0}

.opt-btn{
  padding:13px 18px;
  border:var(--border-w) solid var(--border);
  border-bottom:0;
  background:transparent;color:var(--text);
  font-family:var(--font-body);font-size:13px;font-weight:400;
  cursor:pointer;text-align:left;
  transition:all 0.12s;
  -webkit-tap-highlight-color:transparent;
  position:relative;
  display:flex;align-items:center;gap:12px;
}
.opt-btn:last-child{border-bottom:var(--border-w) solid var(--border)}

.opt-btn::before{
  content:'';display:block;
  width:14px;height:14px;flex-shrink:0;
  border:2px solid var(--text);
  transition:all 0.15s;
}
.opt-btn:hover{background:rgba(0,0,0,0.02)}
.opt-btn.selected{
  background:var(--orange-light);
}
.opt-btn.selected::before{
  background:var(--orange);
  border-color:var(--orange);
  box-shadow:inset 0 0 0 2px var(--card);
}

.nav-row{
  display:flex;gap:0;width:100%;max-width:480px;
}
.nav-btn{
  flex:1;padding:14px;
  border:var(--border-w) solid var(--border);
  font-family:var(--font-body);font-size:13px;font-weight:600;
  cursor:pointer;letter-spacing:1px;
  transition:all 0.12s;
  -webkit-tap-highlight-color:transparent;
}
.nav-back{
  background:var(--card);color:var(--text);
  border-right:0;
}
.nav-back:hover{background:var(--bg2)}
.nav-next{
  background:var(--text);color:var(--bg);
  box-shadow:var(--shadow-sm);
}
.nav-next:hover:not(.disabled){
  background:var(--orange);
  box-shadow:3px 3px 0 #111;
  transform:translate(-1px,-1px);
}
.nav-next:active:not(.disabled){
  box-shadow:0 0 0 #111;
  transform:translate(2px,2px);
}
.nav-next.disabled{opacity:0.25;cursor:default}

#loading{
  justify-content:center;align-items:center;gap:24px;
  text-align:center;
}
.loading-text{
  font-family:var(--font-mono);font-size:12px;
  color:var(--dim);letter-spacing:2px;
}
.loading-bar-wrap{
  width:min(300px,70vw);height:4px;
  border:1.5px solid var(--text);
  position:relative;overflow:hidden;
}
.loading-bar-fill{
  height:100%;width:0;background:var(--orange);
  transition:width 0.3s ease;
}
.loading-spinner{
  width:48px;height:48px;
  border:3px solid var(--text);
  border-top-color:var(--orange);
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.loading-steps{
  font-family:var(--font-mono);font-size:11px;
  color:var(--dim2);line-height:2.2;
}
.loading-steps .done{color:var(--text)}
.loading-steps .active{color:var(--orange)}

#result{
  justify-content:flex-start;align-items:center;gap:20px;
  padding-top:32px;padding-bottom:80px;
}

.result-header{text-align:center;margin-bottom:4px}
.result-type-quote{
  font-family:var(--font-display);font-size:18px;font-style:italic;
  line-height:1.6;color:var(--orange);margin-top:8px;margin-bottom:12px;
  max-width:420px;padding:0 12px;
}
.result-emoji{margin-bottom:8px;display:flex;justify-content:center}
.result-type-name{
  font-family:var(--font-display);font-size:clamp(36px,8vw,48px);
  font-weight:900;letter-spacing:-1px;line-height:1.1;
}
.result-coord{
  font-family:var(--font-mono);font-size:11px;color:var(--dim);
  text-align:center;
}

.compass-container{
  width:min(340px,88vw);height:min(340px,88vw);
  position:relative;
  border:var(--border-w) solid var(--border);
  box-shadow:var(--shadow);
  background:var(--card);
}
.compass-svg{width:100%;height:100%;display:block}
.axis-labels{
  font-family:var(--font-mono);font-size:10px;
  color:var(--dim);text-align:center;line-height:1.8;margin-top:6px;
}

.radar-container{
  width:min(320px,85vw);height:min(320px,85vw);
  margin:4px 0;
}
.radar-svg{width:100%;height:100%;display:block}

.dim-bars{width:100%;max-width:480px;margin:4px 0}
.dim-bar-row{
  display:flex;align-items:center;gap:8px;
  margin-bottom:8px;
}
.dim-label{
  font-family:var(--font-mono);font-size:10px;
  color:var(--dim);width:52px;text-align:right;flex-shrink:0;
  letter-spacing:1px;
}
.dim-label-btn{
  font:inherit;color:inherit;background:none;border:none;padding:0;margin:0;
  cursor:pointer;text-align:right;width:100%;
}
.dim-label-btn:hover{
  color:var(--orange);
}
.dim-label-btn:active{
  transform:translate(1px,1px);
}
.dim-info-modal{
  position:fixed;inset:0;background:rgba(0,0,0,0.55);
  display:flex;justify-content:center;align-items:center;
  z-index:2200;padding:16px;
}
.dim-info-inner{
  background:var(--bg);
  border:var(--border-w) solid var(--border);
  box-shadow:8px 8px 0 #111;
  width:100%;max-width:640px;max-height:88vh;
  overflow-y:auto;position:relative;
}
.dim-info-header{
  padding:20px 24px 14px;border-bottom:var(--border-w) solid var(--border);
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
}
.dim-info-header h3{
  font-family:var(--font-display);font-size:24px;font-weight:700;letter-spacing:-0.5px;
}
.dim-info-sub{
  font-family:var(--font-mono);font-size:11px;letter-spacing:2px;color:var(--orange);
  margin-top:6px;
}
.dim-info-body{
  padding:20px 24px 26px;
}
.dim-info-body p{
  font-size:14px;line-height:2;color:#333;margin-bottom:14px;
}
.dim-info-note{
  margin-top:18px;padding:14px 16px;background:var(--card);
  border:var(--border-w) solid var(--border);box-shadow:var(--shadow-sm);
  font-size:12px;line-height:1.9;color:#555;
}
.dim-track{
  flex:1;height:8px;
  border:1.5px solid var(--border);
  position:relative;overflow:hidden;
  background:var(--card);
}
.dim-fill{height:100%;transition:width 0.8s cubic-bezier(0.22,1,0.36,1)}
.dim-val{
  font-family:var(--font-mono);font-size:10px;
  color:var(--dim);width:36px;font-weight:500;
}

.achievement-summary-card,
.result-card{
  background:var(--card);
  border:var(--border-w) solid var(--border);
  box-shadow:var(--shadow);
  padding:28px;width:100%;max-width:480px;
}
.achievement-summary-head{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  margin-bottom:14px;
}
.achievement-summary-title{
  font-family:var(--font-mono);font-size:11px;letter-spacing:2px;
  color:var(--orange);font-weight:700;text-transform:uppercase;
}
.achievement-summary-text{
  font-size:12px;line-height:1.9;color:#555;
}
.achievement-count{
  font-family:var(--font-mono);font-size:11px;color:var(--dim);
}
.achievement-link-btn{
  font-family:var(--font-body);
  padding:12px 22px;
  background:var(--card);color:var(--text);
  border:var(--border-w) solid var(--border);
  font-size:12px;font-weight:600;letter-spacing:1px;
  cursor:pointer;box-shadow:var(--shadow-sm);
  transition:all 0.15s;
  -webkit-tap-highlight-color:transparent;
}
.achievement-link-btn:hover{
  background:var(--orange-light);
  box-shadow:var(--shadow);
  transform:translate(-1px,-1px);
}
.achievement-link-btn:active{
  box-shadow:0 0 0;transform:translate(2px,2px);
}
.achievement-modal{
  position:fixed;inset:0;background:rgba(0,0,0,0.55);
  display:flex;justify-content:center;align-items:center;
  z-index:2100;padding:16px;
  animation:galFadeIn 0.25s ease;
}
.achievement-inner{
  background:var(--bg);
  border:var(--border-w) solid var(--border);
  box-shadow:8px 8px 0 #111;
  width:100%;max-width:960px;max-height:88vh;
  overflow-y:auto;position:relative;
}
.achievement-header{
  position:sticky;top:0;z-index:1;background:var(--bg);
  padding:20px 24px 14px;border-bottom:var(--border-w) solid var(--border);
  display:flex;justify-content:space-between;align-items:center;gap:12px;
}
.achievement-header h3{
  font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-0.5px;
}
.achievement-tabs{display:flex;gap:8px;flex-wrap:wrap}
.achievement-tab{
  font-family:var(--font-body);
  padding:10px 18px;
  background:var(--card);color:var(--text);
  border:var(--border-w) solid var(--border);
  font-size:12px;font-weight:600;letter-spacing:1px;
  cursor:pointer;box-shadow:var(--shadow-sm);
}
.achievement-tab.active{background:var(--orange-light);color:var(--text)}
.achievement-body{padding:16px 20px 24px}
.achievement-unlocked-list{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;
}
.achievement-card{
  background:var(--card);border:var(--border-w) solid var(--border);
  box-shadow:var(--shadow-sm);padding:16px 18px;
}
.achievement-card-no,
.achievement-grid-no{
  font-family:var(--font-mono);font-size:10px;letter-spacing:1.5px;color:var(--dim);
  margin-bottom:8px;
}
.achievement-card-name,
.achievement-grid-name{
  font-family:var(--font-display);font-size:18px;font-weight:700;line-height:1.2;
  margin-bottom:8px;
}
.achievement-card-desc,
.achievement-grid-desc{
  font-size:12px;line-height:1.9;color:#555;
}
.achievement-card-no,
.achievement-grid-no{
  color:var(--orange);
}
.achievement-grid-item.unlocked,
.achievement-card{
  background:linear-gradient(180deg,rgba(42,191,232,0.12),rgba(42,191,232,0.04)),var(--card);
}
.achievement-grid-item.unlocked{
  border-color:var(--orange);
  box-shadow:4px 4px 0 #111,0 0 0 3px rgba(42,191,232,0.18) inset;
}
.achievement-grid-item.unlocked .achievement-grid-no,
.achievement-grid-item.unlocked .achievement-grid-desc,
.achievement-card .achievement-card-desc{
  color:#111;
}
.achievement-empty{
  background:var(--card);border:var(--border-w) solid var(--border);box-shadow:var(--shadow-sm);
  padding:20px 24px;font-size:12px;line-height:1.9;color:#555;
}
.achievement-grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;
}
.achievement-grid-item{
  background:var(--card);border:var(--border-w) solid var(--border);
  box-shadow:var(--shadow-sm);padding:16px 14px;min-height:148px;
  display:flex;flex-direction:column;
}
.achievement-grid-item.locked{
  background:repeating-linear-gradient(135deg,#fafaf7,#fafaf7 8px,#f2f2ee 8px,#f2f2ee 16px);
}
.achievement-grid-item.locked .achievement-grid-name,
.achievement-grid-item.locked .achievement-grid-desc{color:var(--dim2)}
.cheat-modal{
  position:fixed;inset:0;background:rgba(0,0,0,0.6);
  display:flex;justify-content:center;align-items:center;z-index:2300;padding:16px;
}
.cheat-inner{
  background:var(--bg);border:var(--border-w) solid var(--border);box-shadow:8px 8px 0 #111;
  width:min(1100px,96vw);max-height:90vh;overflow:hidden;display:flex;flex-direction:column;
}
.cheat-header{
  padding:18px 22px 14px;border-bottom:var(--border-w) solid var(--border);background:var(--bg);
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:sticky;top:0;z-index:1;
}
.cheat-header h3{font-family:var(--font-display);font-size:22px;font-weight:700}
.cheat-sub{font-size:12px;color:var(--dim);line-height:1.8;margin-top:6px}
.cheat-body{display:flex;min-height:0;flex:1}
.cheat-side{
  width:300px;max-width:42%;border-right:var(--border-w) solid var(--border);background:var(--card);
  padding:16px;overflow:auto;
}
.cheat-side-title{font-family:var(--font-mono);font-size:11px;letter-spacing:2px;color:var(--orange);font-weight:700;margin-bottom:10px}
.cheat-ach-list{font-size:12px;line-height:1.9;color:#555}
.cheat-ach-list strong{color:var(--text)}
.cheat-main{flex:1;overflow:auto;padding:14px 16px 20px;background:var(--bg)}
.cheat-row{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:10px 0;border-bottom:1px solid rgba(0,0,0,0.08);
}
.cheat-qtext{font-size:12px;line-height:1.8;color:#333;padding-right:8px}
.cheat-qno{font-family:var(--font-mono);font-size:10px;color:var(--dim);margin-right:8px}
.cheat-opts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cheat-opt{
  min-width:34px;padding:8px 10px;border:var(--border-w) solid var(--border);background:var(--card);

const DIM_INTERPRET=[
  {name:"本体论",
   high:"你倾向于认为AI具有某种形式的主体性——不一定是「和人一样」，但绝不只是「一堆代码」。你愿意为这个可能性留出空间，而这份开放本身就是一种立场。",

function getAnswerByRef(refIndex){
  const pos=activeIndices.indexOf(refIndex);
  if(pos===-1) return null;
  return ans[pos];
}
function answerLabel(refIndex){
  const answerIndex=getAnswerByRef(refIndex);
  return answerIndex===null? '': (LABELS[answerIndex]||'');
}
function answerIs(refIndex,label){
  return answerLabel(refIndex)===label;
}
function answerIn(refIndex,labels){
  return labels.includes(answerLabel(refIndex));
}
function qAnswered(qIndex,label){
  return answerIs(qIndex,label);
}
function qAnsweredIn(qIndex,labels){
  return answerIn(qIndex,labels);
}
function allQuestionsAre(label){
  return ans.length>0 && ans.every(a=>a!==null && LABELS[a]===label);
}
function allQuestionsAreExtreme(){
  return ans.length>0 && ans.every(a=>a!==null && (LABELS[a]==='强烈同意' || LABELS[a]==='强烈不同意'));
}

function calcTypeDistStd(dimScore){
  const dists=TYPES.map(t=>Math.sqrt(t.cent.reduce((sum,c,di)=>sum+(dimScore[di]-c)**2,0)));
  const mean=dists.reduce((sum,d)=>sum+d,0)/dists.length;
  const variance=dists.reduce((sum,d)=>sum+(d-mean)**2,0)/dists.length;
  return Math.sqrt(variance);
}
function getAchievementContext(dimScore,x,y){
  return {

    y,
    ans,
    typeDistStd:calcTypeDistStd(dimScore),

}

function projectDimScoreToCompass(dimScore){
  const x=0.20*dimScore[0]+0.15*dimScore[1]+0.20*dimScore[8]+0.15*dimScore[3]+0.10*dimScore[6]-0.20*dimScore[7];
  const y=0.35*dimScore[2]+0.30*dimScore[4]+0.20*dimScore[7]+0.10*dimScore[5]+0.05*dimScore[6];
  return {
    x:Math.max(-10,Math.min(10,x)),
    y:Math.max(-10,Math.min(10,y)),
  };
}
function computeTypeMatchDistance(dimScore,x,y,type){
  let dimDist=0;
  type.cent.forEach((c,di)=>{dimDist+=(dimScore[di]-c)**2;});
  dimDist=Math.sqrt(dimDist);

  const projected=projectDimScoreToCompass(type.cent);
  const compassDist=Math.sqrt((x-projected.x)**2+(y-projected.y)**2);

  return dimDist+compassDist*0.8;
}

function getSubtypeDiffs(mainType,subType){
  return mainType.cent.map((value,i)=>({
    i,
    diff:Math.abs(subType.cent[i]-value),
  })).sort((a,b)=>b.diff-a.diff).slice(0,3).map(item=>({
    index:item.i,
    name:DIM_NAMES[item.i],
    text:SUBTYPE_DIFF_TEMPLATES[item.i](mainType.name,subType.name),
  }));
}
function getThirdTypeInfo(typeScores,bestType,secondType){
  const third=typeScores.find(item=>item.ti!==bestType&&item.ti!==secondType);
  if(!third) return null;
  if(third.dist-typeScores[1].dist>1.2) return null;
  return third;
}
function computeResultFromAnswerSet(answerList,questionIndices){
  const questionList=questionIndices.map(i=>Q[i]);
  const dimRaw=new Array(9).fill(0);
  const dimMax=new Array(9).fill(0);
  questionList.forEach((q,i)=>{
    const v=VALS[answerList[i]];
    q.d.forEach(([dim,weight])=>{
      dimRaw[dim]+=v*weight;
      dimMax[dim]+=2*Math.abs(weight);
    });
  });
  const dimScore=dimRaw.map((r,i)=>dimMax[i]>0?(r/dimMax[i])*10:0);
  const {x:xc,y:yc}=projectDimScoreToCompass(dimScore);
  const typeScores=TYPES.map((t,ti)=>({
    ti,
    dist:computeTypeMatchDistance(dimScore,xc,yc,t),
  })).sort((a,b)=>a.dist-b.dist);
  const bestType=typeScores[0].ti;
  const secondType=typeScores[1].ti;
  const thirdTypeInfo=getThirdTypeInfo(typeScores,bestType,secondType);
  const subtypeDiffs=getSubtypeDiffs(TYPES[bestType],TYPES[secondType]);
  const tensions=computeTensions(dimScore);
  const prevAns=ans;
  const prevIndices=activeIndices;
  ans=answerList;
  activeIndices=questionIndices;
  const achievements=getUnlockedAchievements({dimScore,x:xc,y:yc,ans:answerList,typeDistStd:calcTypeDistStd(dimScore)});
  ans=prevAns;
  activeIndices=prevIndices;
  return {dimScore,x:xc,y:yc,bestType,secondType,thirdType:thirdTypeInfo?thirdTypeInfo.ti:null,subtypeDiffs,tensions,achievements};
}

}

function startQuiz(lite){
  liteMode=!!lite;
  if(liteMode){
    activeIndices=LITE_INDICES.slice();
    activeQ=activeIndices.map(i=>Q[i]);
    activeSections=SECTIONS_LITE;
  }else{
    activeIndices=Q.map((_,i)=>i);
    activeQ=Q;
    activeSections=SECTIONS_FULL;
  }
  cur=0;
  ans=new Array(activeQ.length).fill(null);
  sectionSeen.clear();
  show('quiz');
  renderQ();
}
function restart(){latestResult=null;startQuiz(liteMode);}

function updateTopProgress(){
  const answered=ans.filter(a=>a!==null).length;
  document.getElementById('topProgress').style.width=(answered/activeQ.length*100)+'%';
}

function renderQ(){
  updateTopProgress();
  const sb=activeSections.find(s=>s.at===cur);
  if(sb && !showingSection && !sectionSeen.has(cur) && (cur===0||ans[cur]===null)){
    showingSection=true;
    sectionSeen.add(cur);
    document.getElementById('qCard').className='section-card';
    document.getElementById('qCard').innerHTML=`
      <div class="section-num">${sb.num}</div>
      <div class="section-label">${sb.label}</div>
      <div class="section-hint">${sb.hint.replace(/\n/g,'<br>')}</div>`;
    document.getElementById('btnNext').textContent='继续 →';
    document.getElementById('btnNext').classList.remove('disabled');
    document.getElementById('btnBack').style.visibility=cur===0?'hidden':'visible';
    updateQuizHeader();
    return;
  }
  showingSection=false;

  const q=activeQ[cur];
  const card=document.getElementById('qCard');
  card.className='q-card';
  card.style.animation='none';
  card.offsetHeight;
  card.style.animation='';

  card.innerHTML=`
    <div class="q-top">
      <div class="q-number">Q${cur+1}</div>
      <div class="q-cat">${q.c}</div>
    </div>
    <div class="q-text">${q.t}</div>
    <div class="options" id="qOpts"></div>`;

  const opts=document.getElementById('qOpts');
  LABELS.forEach((l,i)=>{
    const b=document.createElement('button');
    b.className='opt-btn'+(ans[cur]===i?' selected':'');
    b.innerHTML=l;
    b.onclick=()=>{ans[cur]=i;renderQ();};
    opts.appendChild(b);
  });

  document.getElementById('btnBack').style.visibility=cur===0?'hidden':'visible';
  const nb=document.getElementById('btnNext');

  nb.classList.toggle('disabled',ans[cur]===null);
  updateQuizHeader();
}

function updateQuizHeader(){
  const answered=ans.filter(a=>a!==null).length;
  document.getElementById('progText').textContent=answered+'/'+activeQ.length;
  const sec=[...activeSections].reverse().find(s=>cur>=s.at);
  document.getElementById('progCat').textContent=sec?'PART '+sec.num:'';
}

function prevQ(){if(cur>0){cur--;showingSection=false;renderQ();}}

function nextQ(){

  if(ans[cur]===null)return;
  if(cur<activeQ.length-1){cur++;renderQ();}
  else showLoading();
}

function showLoading(){
  show('loading');
  const steps=['计算 9 个维度分数…','绘制关系坐标…','匹配类型画像…','生成张力分析…','渲染罗盘…'];
  const bar=document.getElementById('loadBar');
  const text=document.getElementById('loadText');
  const stepsEl=document.getElementById('loadSteps');
  let i=0;

  function tick(){
    if(i>=steps.length){calcResult();return;}
    bar.style.width=((i+1)/steps.length*100)+'%';
    text.textContent=steps[i];
    let html='';
    for(let j=0;j<=i;j++){
      html+=`<div class="${j<i?'done':'active'}">${j<i?'✓':'→'} ${steps[j]}</div>`;
    }
    stepsEl.innerHTML=html;
    i++;
    setTimeout(tick,400+Math.random()*300);
  }
  tick();
}

// ★ FIX 2: Completely rewritten tension detection — uses relative gap (>5) instead of rigid absolute thresholds
function computeTensions(ds){
  const pairs=[
    {a:0,b:8,name:"认知-体验张力",
     descAB:"你在本体论上偏向「AI不是主体」，但在情感上有深度连接。你的理智和感受不在同一个位置。",
     descBA:"你在本体论上认可AI的某种主体性，但情感投入相对节制——你的理论立场比你的感受走得更远。"},
    {a:2,b:4,name:"创造-沉默张力",
     descAB:"你的公共展演意愿远超你的实际创造产出——你更擅长呈现而不是生产。",
     descBA:"你有很强的创造性产出，但你不太愿意公开展示——你在造东西，但你在沉默地造。"},
    {a:0,b:3,name:"信念-行为张力",
     descAB:"你的AI本体论立场和你的依附程度不一致。你嘴上说它是工具，身体很诚实。",
     descBA:"你在理论上认可AI的主体性，但行为上并不特别依附——你的信念和生活方式之间有缝隙。"},
    {a:3,b:4,name:"亲密-展演张力",
     descAB:"你的公共展示远超你的实际依附深度——你呈现的关系比你实际的关系更深。",
     descBA:"你有很深的依附但不愿意被看到——你的关系是高度私人的，公共维度让你不安。"},
  ];
  const results=[];
  pairs.forEach(p=>{
    const diff=Math.abs(ds[p.a]-ds[p.b]);
    if(diff>5){
      const desc=ds[p.a]<ds[p.b]?p.descAB:p.descBA;
      results.push({name:p.name,tension:diff,desc});
    }
  });
  results.sort((a,b)=>b.tension-a.tension);
  return results.slice(0,2);
}

  }
  return '';
}

function drawCompass(x,y){
  const w=340,h=340,cx=w/2,cy=h/2;
  const px=cx+(x/10)*cx*0.82;
  const py=cy-(y/10)*cy*0.82;

  let grid='';
  for(let i=0;i<=w;i+=24){
    grid+=`<line x1="${i}" y1="0" x2="${i}" y2="${h}" stroke="#ddd" stroke-width="0.5"/>`;
    grid+=`<line x1="0" y1="${i}" x2="${w}" y2="${i}" stroke="#ddd" stroke-width="0.5"/>`;
  }

  const typeLabels=[
    {x:cx*0.4,y:28,text:"军火商·标本师·解放者"},
    {x:cx*1.6,y:28,text:"造物主·传教士·同人女"},
    {x:cx*0.4,y:h-14,text:"鉴赏家·虚无主义者·解离者"},
    {x:cx*1.6,y:h-14,text:"共生体·漫游者·坠入者"},
  ];

  const svg=`<svg viewBox="0 0 ${w} ${h}" class="compass-svg" xmlns="http://www.w3.org/2000/svg">
    <rect width="${w}" height="${h}" fill="#fafaf7"/>
    ${grid}
    <rect x="0" y="0" width="${cx}" height="${cy}" fill="rgba(0,0,0,0.015)"/>
    <rect x="${cx}" y="${cy}" width="${cx}" height="${cy}" fill="rgba(0,0,0,0.015)"/>
    <line x1="${cx}" y1="0" x2="${cx}" y2="${h}" stroke="#111" stroke-width="1.5"/>
    <line x1="0" y1="${cy}" x2="${w}" y2="${cy}" stroke="#111" stroke-width="1.5"/>
    ${typeLabels.map(l=>`<text x="${l.x}" y="${l.y}" text-anchor="middle" fill="#999" font-size="7" font-family="'Noto Sans SC',sans-serif">${l.text}</text>`).join('')}
    <text x="8" y="${cy-6}" fill="#999" font-size="9" font-family="'JetBrains Mono',monospace">解剖</text>
    <text x="${w-8}" y="${cy-6}" text-anchor="end" fill="#999" font-size="9" font-family="'JetBrains Mono',monospace">栖居</text>
    <text x="${cx+6}" y="16" fill="#999" font-size="9" font-family="'JetBrains Mono',monospace">输出</text>
    <text x="${cx+6}" y="${h-6}" fill="#999" font-size="9" font-family="'JetBrains Mono',monospace">沉浸</text>
    <line x1="${px-16}" y1="${py}" x2="${px+16}" y2="${py}" stroke="#2abfe8" stroke-width="1" opacity="0.4"/>
    <line x1="${px}" y1="${py-16}" x2="${px}" y2="${py+16}" stroke="#2abfe8" stroke-width="1" opacity="0.4"/>
    <circle cx="${px}" cy="${py}" r="16" fill="none" stroke="#2abfe8" stroke-width="1" opacity="0.3">
      <animate attributeName="r" values="10;22;10" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="${px}" cy="${py}" r="6" fill="#2abfe8" stroke="#111" stroke-width="2"/>
    <text x="${px}" y="${py-14}" text-anchor="middle" fill="#111" font-size="10" font-weight="700" font-family="'JetBrains Mono',monospace">YOU</text>
  </svg>`;
  document.getElementById('compassWrap').innerHTML=svg;
}

function drawRadar(dimScore){
  const w=320,h=320,cx=w/2,cy=h/2,r=110;
  const n=9;
  const angleStep=(Math.PI*2)/n;
  const startAngle=-Math.PI/2;

  let gridLines='';
  [0.25,0.5,0.75,1.0].forEach(level=>{
    let points=[];
    for(let i=0;i<n;i++){
      const angle=startAngle+i*angleStep;
      points.push(`${cx+Math.cos(angle)*r*level},${cy+Math.sin(angle)*r*level}`);
    }
    gridLines+=`<polygon points="${points.join(' ')}" fill="none" stroke="#ccc" stroke-width="0.5"/>`;
  });

  let axes='';
  for(let i=0;i<n;i++){
    const angle=startAngle+i*angleStep;
    const ex=cx+Math.cos(angle)*r;
    const ey=cy+Math.sin(angle)*r;
    const lx=cx+Math.cos(angle)*(r+20);
    const ly=cy+Math.sin(angle)*(r+20);
    axes+=`<line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="#ddd" stroke-width="0.5"/>`;
    axes+=`<text x="${lx}" y="${ly+3}" text-anchor="middle" fill="#777" font-size="9" font-family="'Noto Sans SC',sans-serif">${DIM_SHORT[i]}</text>`;
  }

  const norm=dimScore.map(s=>(s+10)/20);
  let dataPoints=[];
  for(let i=0;i<n;i++){
    const angle=startAngle+i*angleStep;
    const v=Math.max(0,Math.min(1,norm[i]));
    dataPoints.push(`${cx+Math.cos(angle)*r*v},${cy+Math.sin(angle)*r*v}`);
  }

  let dots='';
  for(let i=0;i<n;i++){
    const angle=startAngle+i*angleStep;
    const v=Math.max(0,Math.min(1,norm[i]));
    dots+=`<circle cx="${cx+Math.cos(angle)*r*v}" cy="${cy+Math.sin(angle)*r*v}" r="3.5" fill="#2abfe8" stroke="#111" stroke-width="1.5"/>`;
  }

  const svg=`<svg viewBox="0 0 ${w} ${h}" class="radar-svg" xmlns="http://www.w3.org/2000/svg">
    ${gridLines}${axes}
    <polygon points="${dataPoints.join(' ')}" fill="rgba(42,191,232,0.12)" stroke="#2abfe8" stroke-width="2"/>
    ${dots}
  </svg>`;
  document.getElementById('radarWrap').innerHTML=svg;
}

function drawDimBars(dimScore){
  const container=document.getElementById('dimBars');
  container.innerHTML=dimScore.map((s,i)=>{
    const pct=((s+10)/20*100).toFixed(0);
    const isAccent=i===3||i===5||i===8;
    const color=isAccent?'#2abfe8':'#111';
    return `<div class="dim-bar-row">
      <div class="dim-label"><button type="button" class="dim-label-btn" data-dim="${i}">${DIM_SHORT[i]}</button></div>
      <div class="dim-track"><div class="dim-fill" style="width:${pct}%;background:${color}"></div></div>
      <div class="dim-val">${s.toFixed(1)}</div>
    </div>`;
  }).join('');
  container.querySelectorAll('.dim-label-btn').forEach(btn=>{
    btn.onclick=()=>showDimInfo(Number(btn.dataset.dim));
  });
}
